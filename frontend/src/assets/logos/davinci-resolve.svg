    <radialGradient id="dvSvgRedGrad" cx="34.08" cy="33.65" fx="34.08" fy="33.65" r="8" gradientUnits="userSpaceOnUse" gradientTransform="matrix(1.903 0.760 -0.406 1.017 -17.11 -25.82)">
